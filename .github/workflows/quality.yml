name: Love Arcade Quality Checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: love-arcade-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: npm run check
      - name: Test game logic, privacy and static quality
        run: npm test

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install browser test tooling
        run: npm install --no-save @playwright/test@1.56.1 @axe-core/playwright@4.10.2
      - name: Install Chromium and OS dependencies
        run: npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/love-arcade-http.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:4173/ > /dev/null
      - name: Run mobile browser tests and accessibility audit
        run: npx playwright test tests/browser.spec.mjs --project=chromium --workers=1 --reporter=line
      - name: Store browser test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: love-arcade-browser-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
