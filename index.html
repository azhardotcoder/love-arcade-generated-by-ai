<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Love Arcade 💗</title><script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:radial-gradient(circle at top,#5b235e,#210d34 65%);color:#fff;min-height:100vh}main{max-width:740px;margin:auto;padding:25px 16px}h1{font-size:42px;margin:12px 0}h2{margin:8px 0}p{color:#f5d7ee}.panel{background:#ffffff15;border:1px solid #ffffff30;border-radius:22px;padding:22px;margin:16px 0;box-shadow:0 8px 30px #0002}button,input,textarea{font:inherit;border:0;border-radius:13px;padding:13px;margin:5px 3px}button{background:#ff74aa;color:#290b30;font-weight:700;cursor:pointer}button:disabled{opacity:.5}input,textarea{background:#fff;color:#29102f;max-width:100%;width:260px}textarea{width:100%}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid button{min-height:88px}#game,#lobby{display:none}.muted{color:#e6bdd9}.choices button{display:block;width:100%;text-align:left}.status{font-size:14px;color:#ffd4e8}.heart{font-size:48px}.card{font-size:28px;min-height:70px;width:70px}.selected{background:#fff}#messages{white-space:pre-wrap}</style></head><body><main><header style="text-align:center"><div class="heart">💞</div><h1>Love Arcade</h1><p>A little date night, wherever you are ✨</p></header><section id="entry" class="panel"><h2>Make a private date room</h2><input id="name" maxlength="25" placeholder="Your nickname"><div><button onclick="createRoom()">💌 Create room</button></div><p>Or join your partner</p><input id="roomInput" placeholder="Room code" maxlength="12"><button onclick="joinRoom()">Join 💕</button><p id="error" class="status"></p></section><section id="lobby" class="panel"><h2>Our little room 💗</h2><p>Code: <strong id="code"></strong> <button onclick="copyInvite()">Copy invite</button></p><p class="status" id="connection">Waiting for your partner...</p><div class="panel"><h3>💬 Couple chat</h3><div id="chatLog" style="max-height:190px;overflow:auto;line-height:1.8"></div><input id="chatInput" placeholder="Write something sweet…" maxlength="500" onkeydown="if(event.key==='Enter')sendChat()"><button onclick="sendChat()">Send 💌</button><h3>🎙️ Voice chat</h3><button onclick="startVoice()">Start voice</button><button onclick="endVoice()">Hang up</button><button onclick="remoteAudio?.play()">Enable audio</button><p id="voiceStatus" class="status">Voice off · microphone permission required</p></div><div class="grid"><button onclick="startGame('quiz')">💘 Love Quiz</button><button onclick="startGame('truth')">🌹 Truth or Dare</button><button onclick="startGame('rather')">💭 Would You Rather?</button><button onclick="startGame('notes')">💌 Love Notes</button><button onclick="startGame('match')">🧩 Heart Match</button></div></section><section id="game" class="panel"><button onclick="back()">← Games</button><h2 id="gameTitle"></h2><p id="turn"></p><div id="content"></div><p id="messages" class="status"></p></section><footer style="text-align:center;color:#d7a8ca;padding:25px">Made for two hearts 💕</footer></main><script>
let voiceCall=null,localStream=null,remoteAudio=null,partnerName="Partner",chatHistory=[],tdChoice="",tdStatus="choose",tdTurn=0,tdTask="",peer,conn,host=false,room='',game='',round=0,score=[0,0],note='',answers={},match=[],flipped=[],matched=[],myIndex=0,turnIndex=0;
const $=id=>document.getElementById(id), safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const quiz=['What was your first impression of me?','What is our dream date?','Which song reminds you of us?','What little thing makes me smile?','Where should we travel together?','What is my favorite way to be loved?'];
const truth=['What moment with me makes you blush?','When did you first feel butterflies?','What is your favorite memory of us?','What is one thing you want us to try together?','What do you find most adorable about me?'];
const dare=['Send your partner three genuine compliments.','Describe your dream kiss in one sentence.','Make up a cute nickname for your partner.','Give your partner a 20-second love speech.','Promise a surprise date idea.'];
const rather=[['Sunset beach date','Cozy rainy movie night'],['Matching outfits','Matching bracelets'],['Surprise road trip','Planned romantic vacation'],['Cuddle under stars','Dance in the kitchen'],['Love letter','Surprise flowers']];
function fail(s){$('error').textContent=s}function setConnected(){ $('connection').textContent='💚 Connected! You can play together.'; }
function bind(c){conn=c;conn.on('open',()=>{setConnected();send({type:'hello',name:$('name').value});});conn.on('data',receive);conn.on('close',()=>{$('connection').textContent='Partner disconnected. Refresh and reconnect.'});conn.on('error',e=>{$('connection').textContent='Connection error: '+e.message})}
function init(id,hosting){host=hosting;room=id;myIndex=host?0:1;peer=new Peer('love-arcade-'+id+(host?'':'-guest'),{debug:0});peer.on('open',()=>{showLobby();if(!host)bind(peer.connect('love-arcade-'+id,{reliable:true}));});peer.on('call',async call=>{try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});localStream=stream;call.answer(stream);setupCall(call)}catch(e){$('voiceStatus').textContent='Microphone unavailable: '+e.message}});peer.on('connection',c=>{if(host&&!conn)bind(c);else c.close()});peer.on('error',e=>{fail('Connection issue: '+e.message+'. Try another room or refresh.');$('connection').textContent=e.message;});}
function createRoom(){if(!$('name').value.trim())$('name').value='Sweetheart';init(Math.random().toString(36).slice(2,8).toUpperCase(),true)}
function joinRoom(){const id=$('roomInput').value.trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(id))return fail('Enter a valid 6-character room code.');if(!$('name').value.trim())$('name').value='Sweetheart';init(id,false)}
function setupCall(call){voiceCall=call;$('voiceStatus').textContent='Voice connected or connecting…';call.on('stream',stream=>{if(!remoteAudio){remoteAudio=document.createElement('audio');remoteAudio.autoplay=true;remoteAudio.playsInline=true;document.body.appendChild(remoteAudio)}remoteAudio.srcObject=stream;remoteAudio.play().catch(()=>{$('voiceStatus').textContent='Tap Enable audio to hear your partner';});$('voiceStatus').textContent='🎙️ Voice connected'});call.on('close',()=>{$('voiceStatus').textContent='Voice call ended';voiceCall=null})}
async function startVoice(){if(!conn?.open)return alert('Wait for your partner');try{localStream=await navigator.mediaDevices.getUserMedia({audio:true});setupCall(peer.call(host?'love-arcade-'+room+'-guest':'love-arcade-'+room,localStream));}catch(e){$('voiceStatus').textContent='Microphone permission needed: '+e.message}}
function endVoice(){voiceCall?.close();voiceCall=null;localStream?.getTracks().forEach(t=>t.stop());localStream=null;$('voiceStatus').textContent='Voice off'}
function sendChat(){const e=$('chatInput'),v=e.value.trim().slice(0,500);if(!v)return;chatHistory.push({who:'You',message:v});send({type:'chat',message:v});e.value='';drawChat()}
function drawChat(){const el=$('chatLog');if(el){el.innerHTML=chatHistory.slice(-60).map(x=>'<div><strong>'+safe(x.who)+':</strong> '+safe(x.message)+'</div>').join('');el.scrollTop=el.scrollHeight}}
function tdRender(){if(game!=='truth')return;const mine=tdTurn===myIndex;const c=$('content');$('turn').textContent=(mine?'Your turn 💗':partnerName+"'s turn 💗")+' · Round '+(round+1);let html='<p class="muted">Each challenge must be approved by your partner before the next turn.</p>';if(tdStatus==='choose'){html+=mine?'<h3>Pick your challenge</h3><button onclick="tdPick(\'truth\')">💬 Truth</button><button onclick="tdPick(\'dare\')">🔥 Dare</button>':'<h3>Waiting for your partner to choose Truth or Dare…</h3>'}else{html+='<p class="muted">'+safe(tdChoice.toUpperCase())+'</p><h2>'+safe(tdTask)+'</h2>';if(tdStatus==='task'){html+=mine?'<button onclick="tdComplete()">✅ I completed my task</button>':'<p>Waiting for your partner to finish…</p>'}if(tdStatus==='approval'){html+=mine?'<p>Waiting for your partner to approve your task 💕</p>':'<h3>Did your partner complete it?</h3><button onclick="tdApprove(true)">💚 Approve</button><button onclick="tdApprove(false)">↩️ Try again</button>'}}c.innerHTML=html}
function tdPick(choice){if(tdTurn!==myIndex||tdStatus!=='choose')return;tdChoice=choice;const list=choice==='truth'?truth:dare;tdTask=list[Math.floor(Math.random()*list.length)];tdStatus='task';send({type:'td',state:{tdChoice,tdTask,tdStatus,tdTurn,round}});tdRender()}
function tdComplete(){if(tdTurn!==myIndex||tdStatus!=='task')return;tdStatus='approval';send({type:'td',state:{tdChoice,tdTask,tdStatus,tdTurn,round}});tdRender()}
function tdApprove(ok){if(tdTurn===myIndex||tdStatus!=='approval')return;if(ok){tdTurn=1-tdTurn;round++;tdStatus='choose';tdTask='';tdChoice=''}else tdStatus='task';send({type:'td',state:{tdChoice,tdTask,tdStatus,tdTurn,round}});tdRender()}
function showLobby(){$('entry').style.display='none';$('lobby').style.display='block';$('code').textContent=room}
function copyInvite(){const link=location.origin+location.pathname+'?room='+room;navigator.clipboard.writeText(link).then(()=>{$('connection').textContent='Invite link copied! 💌'}).catch(()=>prompt('Copy this invite:',link))}
function send(data){if(conn&&conn.open)conn.send(data)}
function startGame(g){if(!conn||!conn.open){$('connection').textContent='Wait for your partner to connect first 💗';return}round=0;score=[0,0];note='';answers={};tdTurn=0;tdStatus='choose';tdTask='';tdChoice='';game=g;send({type:'start',game:g});render()}
function back(){game='';$('game').style.display='none';$('lobby').style.display='block';send({type:'back'})}
function next(){round++;answers={};send({type:'next',round});render()}
function receive(d){if(d.type==='hello'){partnerName=String(d.name||'Partner').slice(0,25);setConnected();return}if(d.type==='chat'){chatHistory.push({who:partnerName,message:String(d.message||'').slice(0,500)});drawChat();return}if(d.type==='td'){Object.assign(window,d.state);tdChoice=d.state.tdChoice;tdTask=d.state.tdTask;tdStatus=d.state.tdStatus;tdTurn=d.state.tdTurn;round=d.state.round;tdRender();return}if(d.type==='start'){game=d.game;round=0;score=[0,0];answers={};note='';tdTurn=0;tdStatus='choose';tdTask='';tdChoice='';render()}if(d.type==='back'){game='';$('game').style.display='none';$('lobby').style.display='block'}if(d.type==='next'){round=d.round;answers={};render()}if(d.type==='answer'){answers[1-myIndex]=d.value;render()}if(d.type==='note'){note=d.value;render()}if(d.type==='match'){applyMatch(d.i)}}
function answer(v){answers[myIndex]=v;send({type:'answer',value:v});render()}
function noteSend(){note=$('noteText').value.slice(0,500);send({type:'note',value:note});render()}
function render(){if(!game)return;$('lobby').style.display='none';$('game').style.display='block';$('messages').textContent='';$('turn').textContent='Round '+(round+1);$('gameTitle').textContent={quiz:'💘 Love Quiz',truth:'🌹 Truth or Dare',rather:'💭 Would You Rather?',notes:'💌 Love Notes',match:'🧩 Heart Match'}[game];let c=$('content');if(game==='quiz'){c.innerHTML='<h2>'+safe(quiz[round%quiz.length])+'</h2><textarea id="reply" placeholder="Your answer..." maxlength="400"></textarea><button onclick="answer($(\'reply\').value)">Share answer 💕</button>'+resultHTML();}if(game==='truth'){tdRender();}if(game==='rather'){let opts=rather[round%rather.length];c.innerHTML='<h2>Which would you choose?</h2><div class="choices">'+opts.map((o,i)=>'<button onclick="answer('+i+')">'+safe(o)+'</button>').join('')+'</div>'+resultHTML(opts);}if(game==='notes'){c.innerHTML='<h2>Write a secret love note 💌</h2><textarea id="noteText" maxlength="500" placeholder="Something sweet..."></textarea><button onclick="noteSend()">Send love note</button>'+(note?'<div class="panel"><h3>Your partner wrote:</h3><p>'+safe(note)+'</p></div>':'<p>Waiting for a sweet note...</p>');}if(game==='match'){if(!match.length||round!==0){match=['💗','🌹','💍','💋','🌙','💗','🌹','💍','💋','🌙'].sort(()=>Math.random()-.5);flipped=[];matched=[];round=0;}c.innerHTML='<h2>Find the matching hearts together</h2><div id="cards"></div><button onclick="resetMatch()">New board</button>';drawCards();}}
function resultHTML(opts){let a=answers[myIndex],b=answers[1-myIndex];return '<div class="panel">'+(a===undefined?'Choose or write your answer 💗':'Your answer: '+safe(opts?opts[a]:a))+'<p>'+(b===undefined?'Waiting for your partner...':'Partner: '+safe(opts?opts[b]:b))+'</p>'+(a!==undefined&&b!==undefined?'<button onclick="next()">Next round ➜</button>':'')+'</div>'}
function resetMatch(){match=[];round=1;render();send({type:'start',game:'match'})}
function drawCards(){$('cards').innerHTML=match.map((v,i)=>'<button class="card" '+(matched.includes(i)?'disabled':'')+' onclick="pick('+i+')">'+(matched.includes(i)||flipped.includes(i)?v:'❔')+'</button>').join('');if(matched.length===match.length)$('messages').textContent='You matched every heart! 💖'}
function pick(i){if(flipped.includes(i)||matched.includes(i)||flipped.length>=2)return;applyMatch(i);send({type:'match',i})}
function applyMatch(i){if(flipped.includes(i)||matched.includes(i)||flipped.length>=2)return;flipped.push(i);drawCards();if(flipped.length===2){let pair=[...flipped];if(match[pair[0]]===match[pair[1]]){matched.push(...pair);flipped=[];drawCards()}else{setTimeout(()=>{if(flipped.length===2&&flipped[0]===pair[0]&&flipped[1]===pair[1]){flipped=[];drawCards()}},1200)}}}
const initial=new URLSearchParams(location.search).get('room');if(initial)$('roomInput').value=initial.toUpperCase();
</script></body></html>
